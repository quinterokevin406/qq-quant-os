[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-core"
version = "1.14.0"
description = "QQ Quant OS - núcleo de dominio y contratos"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "mypy", "ruff"]
dashboard = ["streamlit>=1.30", "pandas>=2.0", "plotly>=5.18"]
data = ["yfinance>=0.2.40"]
informe = ["matplotlib>=3.7"]
remoto = ["psycopg2-binary>=2.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.mypy]
python_version = "1.1.0"
strict = true
files = ["src"]
